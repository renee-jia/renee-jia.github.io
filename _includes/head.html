<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  {% if site.enable_copy_code_button -%}
    window.enable_copy_code_button = true;
  {%- endif %}
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"></noscript>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- MathJax for math rendering -->
<script>
  MathJax = {
    tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
  html, body, .initial-content, #main, .page, .archive {
    background: var(--paper, #faf6ef) !important;
  }

  /* Navigation */
  .masthead {
    background: none !important;
    border: none !important;
    border-bottom: 1px solid var(--masthead-rule, #d4c4ae) !important;
    box-shadow: none !important;
    padding: 2.2em 0;
  }

  .masthead::after,
  .masthead::before,
  .masthead__inner-wrap::before,
  .masthead__inner-wrap::after {
    display: none !important;
    content: none !important;
  }

  .masthead__inner-wrap {
    border: none !important;
    background: none !important;
    box-shadow: none !important;
    max-width: 1100px;
    margin: 0 auto;
  }

  .masthead, .masthead__inner-wrap, .masthead__menu,
  .masthead__menu-item, .masthead__title, .masthead__title a {
    border: none !important;
    background: none !important;
  }

  .site-title,
  .site-title a,
  .masthead__title,
  .masthead__title a {
    font-family: var(--font-serif, 'Source Serif 4', Georgia, serif);
    font-weight: 500;
    font-size: 1.45rem;
    letter-spacing: 0.01em;
    color: var(--ink-strong, #3d342b) !important;
    text-decoration: none;
    padding: 0 !important;
    margin: 0 !important;
  }

  .masthead__menu-item {
    font-family: var(--font-sans, 'Source Sans 3', sans-serif);
    font-weight: 400;
    font-size: 0.84rem;
    padding: 0.2em 0.25em;
    margin: 0 0.2em;
  }

  .masthead__menu-item a {
    color: var(--ink-muted, #8a7b6b) !important;
    transition: color 0.2s ease;
  }

  .masthead__menu-item a:hover {
    color: var(--ink-strong, #3d342b) !important;
  }

  /* Footer */
  .page__footer {
    background: var(--paper, #faf6ef) !important;
    border-top: 1px solid var(--rule, #e4d5c4);
    color: var(--ink-faint, #b5a594);
    padding: 1.5em 0;
    margin-top: 0;
  }

  .page__footer a { color: var(--accent, #9a7048); }
  .page__footer a:hover { color: var(--accent-hover, #7d5836); }

  /* Hide auto-generated page titles for distill layout */
  .layout--distill .page__title,
  .layout--distill .page header {
    display: none !important;
  }
</style>

{% if site.head_scripts %}
  {% for script in site.head_scripts %}
    <script src="{{ script | relative_url }}"></script>
  {% endfor %}
{% endif %}
